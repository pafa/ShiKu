name: 参观或运行问题
description: 报告展馆、导览、访问或本地运行时遇到的问题。
labels: []
body:
  - type: markdown
    attributes:
      value: 安全或隐私问题请按仓库内的 SECURITY.md 私下报告。
  - type: textarea
    id: steps
    attributes:
      label: 在哪里、怎样发生
      description: 给出展馆、作品或链接路径，以及从入口开始的最短重现步骤。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期和实际看到或听到的结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 版本与设备
      description: 如果知道，请写 commit 或版本、系统和浏览器。运行服务的问题也请附 Node.js 版本。
