# Include in the nginx http {} context, alongside the host's existing sites.
# One museum-wide budget; guests behind one school network or CDN need not share
# a separately restricted per-IP allowance. Polls by an existing ticket are exempt.
map $uri $shiku_registration {
    default "";
    /api/join $server_name;
    /api/queue/cancel $server_name;
}
limit_req_zone $shiku_registration zone=shiku_reg:1m rate=30r/s;
limit_conn_zone $server_name zone=shiku_conn:1m;
log_format shiku_status '$time_iso8601 $request_method $status ${request_time}s';

server {
    listen 80;
    server_name shiku.xiaoha.org;
    access_log /var/log/nginx/shiku-status.log shiku_status;
    # Per-request nginx error messages may contain a raw URI/referrer.
    # Keep startup errors in the global log; track HTTP failures in the status log.
    error_log /dev/null;
    if ($host != shiku.xiaoha.org) { return 421; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://shiku.xiaoha.org$request_uri; }
}

server {
    listen 443 ssl;
    server_name shiku.xiaoha.org;
    access_log /var/log/nginx/shiku-status.log shiku_status;
    # Per-request nginx error messages may contain a raw URI/referrer.
    # Keep startup errors in the global log; track HTTP failures in the status log.
    error_log /dev/null;
    ssl_certificate /etc/letsencrypt/live/shiku.xiaoha.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shiku.xiaoha.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != shiku.xiaoha.org) { return 421; }

    limit_conn shiku_conn 2048;
    limit_conn_status 503;
    limit_req zone=shiku_reg burst=120 nodelay;
    limit_req_status 429;
    error_page 429 = @shiku_busy;
    location @shiku_busy {
        default_type application/json;
        charset utf-8;
        add_header Retry-After 5 always;
        return 429 '{"error":"登记请求较多，请稍后再试。"}';
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_pass http://127.0.0.1:4173;
        # NDJSON snapshots and movement must reach other visitors immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 65s;
        gzip off;
        client_max_body_size 4k;
    }
}
